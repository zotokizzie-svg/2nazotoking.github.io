<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// THE ANSWER ENGINE 
let ball = { x: 100, y: 300, radius: 11, vx: 0, vy: 0, flying: false };
let defender = { x: 650, y: 150, w: 25, h: 85, speed: 9, dir: 1, name: "TYRONN LUE" }; 
let score = 0;
const gravity = 0.75; 
const hoop = { x: 730, y: 180, w: 60, h: 10 };

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // PHILLY BLACK-TOP COURT BRANDING
    ctx.fillStyle = "rgba(237, 23, 76, 0.1)"; 
    ctx.font = "italic bold 45px Impact";
    ctx.fillText("DOPE CITIES FINEST", 140, 210);
    ctx.font = "bold 18px Courier New";
    ctx.fillStyle = "white";
    ctx.fillText("I3: THE ANSWER EDITION", 280, 245);

    // DRAW HOOP (Rim and Net)
    ctx.fillStyle = "#ED174C"; // Red Rim
    ctx.fillRect(hoop.x, hoop.y, hoop.w, hoop.h);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; // White Net
    ctx.strokeRect(hoop.x + 10, hoop.y + 10, 40, 30);

    // DRAW DEFENDER (With Headband)
    ctx.fillStyle = "#222"; // Jersey
    ctx.fillRect(defender.x, defender.y, defender.w, defender.h);
    ctx.fillStyle = "white"; // Headband
    ctx.fillRect(defender.x, defender.y + 10, defender.w, 8);
    ctx.fillStyle = "white";
    ctx.font = "12px Courier New";
    ctx.fillText(defender.name, defender.x - 25, defender.y - 15);

    // DRAW BALL (Black & Silver 'Queston' Vibes)
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
    ctx.fillStyle = "#333"; 
    ctx.fill();
    ctx.strokeStyle = "#ED174C"; // Red Stitching
    ctx.lineWidth = 2;
    ctx.stroke();

    // DRAW SCORE
    ctx.fillStyle = "#ED174C";
    ctx.font = "24px Impact";
    ctx.fillText("BUCKETS: " + score, 20, 40);
}

// AI'S STEP-BACK JUMPER
// AI'S STEP-BACK LOGIC
canvas.addEventListener("mousedown", (e) => {
    if (!ball.flying) {
        ball.vx = (ball.x - e.clientX) * 0.15;
        ball.vy = -21; 
        ball.flying = true;
    }
});






                   
        

    
    
        


    
    defender.y += defender.speed * defender.dir;
    if(defender.y > 310 || defender.y < 40) defender.dir *= -1;

    if (ball.flying) {
        ball.vy += gravity;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Scoring Logic
        if (ball.x > hoop.x && ball.x < hoop.x + hoop.w &&
            ball.y > hoop.y && ball.y < hoop.y + hoop.h) {
            score++;
            resetBall();
        }

        if (ball.y > 400 || ball.x > 800) {
            resetBall();
        }
    }
}

function resetBall() {
    ball.x = 100; ball.y = 300;
    ball.vx = 0; ball.vy = 0;
    ball.flying = false;
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
