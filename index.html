<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dope Cities Finest | Official Hub</title>
    <style>
        /* High-End Brand Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
        }

        /* Brand Colors & Accent Borders */
        header {
            background: linear-gradient(90deg, #ff3b30 0%, #ffcc00 50%, #34c759 100%);
            padding: 5px;
        }

        .hero-section {
            padding: 60px 20px;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 2px solid #ffcc00;
        }

        /* Black Star Motif Styling */
        .black-star {
            font-size: 3rem;
            color: #000000;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
            margin-bottom: 10px;
            display: inline-block;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p.subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* YouTube & Social Traffic Launchpad */
        .links-container {
            max-width: 500px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1f1f1f;
            color: #ffffff;
            text-decoration: none;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Specific Platform Highlights */
        .btn-youtube {
            border: 2px solid #ff3b30;
            background: rgba(255, 59, 48, 0.1);
        }
        .btn-youtube:hover {
            background: #ff3b30;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.6);
        }

        .btn-instagram {
            border: 2px solid #ffcc00;
            background: rgba(255, 204, 0, 0.1);
        }
        .btn-instagram:hover {
            background: #ffcc00;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }

        /* Game Zone Container */
        .game-section {
            padding: 40px 20px;
            background: #0d0d0d;
        }

        h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #ffcc00;
        }

        .game-window {
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            background: #151515;
            border: 3px solid #34c759;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(52, 199, 89, 0.2);
            position: relative;
        }

        /* Responsive scaling for smaller mobile screens */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .game-window { height: 400px; }
        }
    </style>
</head>
<body>

    <header></header>

    <section class="hero-section">
        <div class="black-star">★</div>
        <h1>Dope Cities Finest</h1>
        <p class="subtitle">Official Digital Headquarters</p>
        
        <div class="links-container">
            <a href="https://www.youtube.com/@YOUR_CHANNEL" target="_blank" class="btn btn-youtube">
                ▶ Subscribe on YouTube
            </a>
            <a href="https://www.instagram.com/zotokizzie2na" target="_blank" class="btn btn-instagram">
                📸 Follow on Instagram
            </a>
        </div>
    </section>

    <section class="game-section">
        <h2>DCF: The Answer Edition</h2>
        <div class="game-window">
            <p style="color: #666;">[ Basketball Game Canvas / Script Active ]</p>
        </div>
    </section>

</body>
</html>
