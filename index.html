<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>DCF 3x3 TOURNAMENT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: #fff; pointer-events: none; }
        .stats { font-size: 20px; color: #ffcc00; text-shadow: 2px 2px #000; }
        .venue-btn { position: absolute; top: 10px; right: 10px; padding: 10px; background: #ED174C; color: #fff; border: none; cursor: pointer; border-radius: 5px; pointer-events: auto; }
        #controls { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #fff; font-size: 12px; }
    </style>
</head>
<body>

<div id="ui">
    <h2 style="margin:0; color: #ED174C;">DCF vs THE LEGENDS</h2>
    <div class="stats" id="score">BUCKETS: 0 | TIME: 60</div>
</div>

<button class="venue-btn" onclick="switchVenue()">SWITCH VENUE</button>

<div id="controls">TAP SCREEN TO CROSSOVER & SHOOT</div>

<script>
let scene, camera, renderer, ball, hoop, court, textureLoader;
let score = 0, timeLeft = 60, isShooting = false;
let velocity = new THREE.Vector3();
let players = [];
let currentVenue = 0; // 0: Street, 1: Beach

const venues = [
    { name: "Street", floor: 0x333333, ambient: 0x404040 },
    { name: "Beach", floor: 0xd2b48c, ambient: 0xffffff }
];

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    textureLoader = new THREE.TextureLoader();

    // Lighting
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(5, 10, 7);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(venues[currentVenue].ambient));

    // Court
    const floorGeo = new THREE.PlaneGeometry(30, 60);
    const floorMat = new THREE.MeshPhongMaterial({ color: venues[currentVenue].floor });
    court = new THREE.Mesh(floorGeo, floorMat);
    court.rotation.x = -Math.PI / 2;
    scene.add(court);

    // Basketball
    const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const ballMat = new THREE.MeshPhongMaterial({ color: 0xff4500 });
    ball = new THREE.Mesh(ballGeo, ballMat);
    scene.add(ball);

    // The Hoop
    const hoopGeo = new THREE.TorusGeometry(0.7, 0.08, 16, 100);
    hoop = new THREE.Mesh(hoopGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    hoop.position.set(0, 6, -15);
    hoop.rotation.x = Math.PI / 2;
    scene.add(hoop);

    // Create 3-on-3 Players (Billboards)
    createPlayer(0, 3, -5, "YOU (2NA ZOTO)"); // Captain
    createPlayer(-4, 2, -10, "DEFENDER 1");   // Jay-Z
    createPlayer(4, 2, -10, "DEFENDER 2"); 

    camera.position.set(0, 6, 12);
    camera.lookAt(0, 4, -5);

    resetBall();
    window.addEventListener('touchstart', shoot);
    window.addEventListener('mousedown', shoot);
    
    startTimer();
    animate();
}

function createPlayer(x, y, z, label) {
    // In a real version, you'd use textureLoader.load('your_image.png')
    const playerGeo = new THREE.PlaneGeometry(3, 5);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0x888888, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(x, 2.5, z);
    scene.add(player);
    players.push(player);
}

function switchVenue() {
    currentVenue = (currentVenue + 1) % venues.length;
    court.material.color.setHex(venues[currentVenue].floor);
    alert("Moving to " + venues[currentVenue].name + " Court!");
}

function startTimer() {
    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            document.getElementById('score').innerText = `BUCKETS: ${score} | TIME: ${timeLeft}`;
        }
    }, 1000);
}

function shoot() {
    if (isShooting || timeLeft <= 0) return;
    isShooting = true;
    velocity.set(0, 0.19, -0.28);
}

function animate() {
    requestAnimationFrame(animate);
    if (isShooting) {
        ball.position.add(velocity);
        velocity.y -= 0.007; 
        
        let dist = ball.position.distanceTo(new THREE.Vector3(0, 6, -15));
        if (dist < 0.8) {
            score += 2;
            resetBall();
        }
        if (ball.position.y < 0.5) resetBall();
    }
    
    // Make players "breathe" or move slightly
    players.forEach((p, i) => {
        p.position.x += Math.sin(Date.now() * 0.002 + i) * 0.01;
    });

    renderer.render(scene, camera);
}

function resetBall() {
    isShooting = false;
    ball.position.set(0, 1.5, 6);
    velocity.set(0,0,0);
}

init();
</script>
</body>
</html>
