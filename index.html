

  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dope Cities Finest: Label Wars</title>
    <style>
        :root {
            --dcf-red: #cc0000;
            --dcf-gold: #ffcc00;
            --dcf-green: #006600;
            --dcf-black: #0a0a0a;
        }

        body {
            margin: 0;
            background-color: var(--dcf-black);
            color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        /* Video/Background Container */
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1544910368-5156f9620169?auto=format&fit=crop&w=1350&q=80'); /* Street court feel */
            background-size: cover;
        }

        h1 {
            color: var(--dcf-gold);
            font-size: 3rem;
            text-shadow: 3px 3px var(--dcf-red);
            margin-bottom: 10px;
        }

        .label-selector {
            display: flex;
            gap: 20px;
            margin-top: 50px;
        }

        .card {
            width: 200px;
            padding: 20px;
            border: 4px solid var(--dcf-gold);
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s, background 0.3s;
            cursor: pointer;
            background: rgba(0,0,0,0.8);
        }

        .card:hover {
            transform: scale(1.1);
            background: var(--dcf-red);
        }

        .card.dcf { border-color: var(--dcf-green); }
        .card.dcf:hover { background: var(--dcf-green); }

        /* Musician Tool / Audio Player */
        .music-tool {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--dcf-black);
            border: 2px solid var(--dcf-gold);
            padding: 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .play-btn {
            background: var(--dcf-gold);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div style="text-align: center;">
        <span style="color: var(--dcf-green);">★</span> 
        <span style="color: var(--dcf-gold);">★</span> 
        <span style="color: var(--dcf-red);">★</span>
    </div>
    <h1>LABEL WARS: 3-on-3</h1>
    <p>FEATURING 2NA ZOTO KIZZIE</p>

    <div class="label-selector">
        <div class="card dcf" onclick="selectLabel('DCFinest')">
            <h3>DCFinest</h3>
            <p>Captain: 2na Zoto Kizzie</p>
            <small>Color: Red/Gold/Green</small>
        </div>

        <div class="card" onclick="selectLabel('Mass Appeal')">
            <h3>Mass Appeal</h3>
            <p>Captain: Nas</p>
            <small>Color: Blue/Grey</small>
        </div>

        <div class="card" onclick="selectLabel('Roc Nation')">
            <h3>Roc Nation</h3>
            <p>Captain: Jay-Z</p>
            <small>Color: Black/White</small>
        </div>
    </div>
</div>

<div class="music-tool">
    <button class="play-btn" onclick="toggleMusic()">▶</button>
    <div id="track-info">Playing: 2na Zoto Kizzie - California High</div>
</div>

<script>
    function selectLabel(name) {
        alert("Entering the league with " + name + "!");
        // Logic to start the basketball physics engine goes here
    }

    function toggleMusic() {
        const btn = document.querySelector('.play-btn');
        btn.innerHTML = (btn.innerHTML === '▶') ? '||' : '▶';
        // Connect your .mp3 link here
    }
</script>

</body>
</html>
