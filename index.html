<canvas id="gameCanvas" width="800" height="400" style="border: 2px solid var(--dcf-gold); background: #222; border-radius: 10px; cursor: crosshair;"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Variables
    let ball = { x: 100, y: 300, radius: 10, vx: 0, vy: 0, flying: false };
    let score = 0;
    const gravity = 0.5;

    // The Hoop (Mass Appeal / Roc Nation side)
    const hoop = { x: 700, y: 150, w: 50, h: 10 };

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Court Branding
        ctx.fillStyle = "rgba(255, 204, 0, 0.1)";
        ctx.font = "40px Arial Black";
        ctx.fillText("DCF MUSIC", 300, 220);

        // Draw Hoop
        ctx.fillStyle = "red";
        ctx.fillRect(hoop.x, hoop.y, hoop.w, hoop.h);

        // Draw Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fillStyle = "#ff6600";
        ctx.fill();
        ctx.closePath();

        if (ball.flying) {
            ball.vy += gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Check for Score
            if (ball.x > hoop.x && ball.x < hoop.x + hoop.w && ball.y > hoop.y && ball.y < hoop.y + hoop.h) {
                score++;
                alert("GOAL! DCFinest takes the lead!");
                resetBall();
            }
            if (ball.y > canvas.height) resetBall();
        }
        requestAnimationFrame(draw);
    }

    function resetBall() {
        ball.flying = false; ball.x = 100; ball.y = 300; ball.vx = 0; ball.vy = 0;
    }

    canvas.addEventListener('mousedown', () => {
        if(!ball.flying) {
            ball.flying = true;
            ball.vx = 12; // Power
            ball.vy = -15; // Arc
        }
    });

    draw();
</script>
