4<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>DCF: The Answer Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #status { position: fixed; top: 15px; width: 100%; text-align: center; color:  #FFFFFF;font-weight: bold; z-index: 10; letter-spacing: 1px; }
        canvas { display: block; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); touch-action: none; }
    </style>
</head>
<body>
    <div id="status">INITIALIZING DCF ENGINE...</div>
    <canvas id="game"></canvas>
    <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;">
    <a href="https://t.me/DCF_sales_bot" 
       target="_blank" 
       style="background-color: #0088cc; 
              color: white; 
              padding: 12px 24px; 
              text-decoration: none; 
              font-family: sans-serif;
              font-weight: bold; 
              border-radius: 8px; 
              display: inline-block;
              box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
       Chat with DCF Sales Bot
    </a>
</div>


<script>
    // --- AUTO-FIXER ---
    window.onerror = function() { location.reload(); return true; };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    let ball = { x: 60, y: canvas.height - 60, r: 18, vx: 0, vy: 0, flying: false };
    let hoop = { x: canvas.width - 80, y: 200, w: 60, h: 10 };
    let score = 0;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // BRANDING
        ctx.fillStyle = "rgba(237, 23, 76, 0.2)";
        ctx.font = "bold 35px Arial";
        ctx.fillText("DOPE CITIES FINEST", 20, canvas.height/2);

        ctx.fillStyle = "#ED174C";
        ctx.font = "bold 20px Arial";
        ctx.fillText("BUCKETS: " + score, 20, 50);

        // HOOP
        ctx.fillStyle = "#fff";
        ctx.fillRect(hoop.x, hoop.y, hoop.w, hoop.h);

        // BALL
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fillStyle = "#ED174C";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        update();
        requestAnimationFrame(draw);
    }

    function update() {
        if (ball.flying) {
            ball.vy += 0.8; 
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x > hoop.x && ball.x < hoop.x + hoop.w && ball.y > hoop.y && ball.y < hoop.y + 25) {
                score++;
                reset();
            }
            if (ball.y > canvas.height || ball.x > canvas.width) reset();
        }
    }

    function reset() {
        ball.flying = false;
        ball.x = 60;
        ball.y = canvas.height - 60;
        document.getElementById('status').innerText = "TAP TO SHOOT";
    }

    const launch = (e) => {
        if (e) e.preventDefault();
        if (!ball.flying) {
            ball.vx = (canvas.width / 16); 
            ball.vy = -21;
            ball.flying = true;
            document.getElementById('status').innerText = "BALL IN AIR";
        }
    };

    canvas.addEventListener("mousedown", launch);
    canvas.addEventListener("touchstart", launch);

    draw();
    document.getElementById('status').innerText = "READY: TAP SCREEN";
</script>
</body>
</html>
